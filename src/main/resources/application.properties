spring.application.name=gultie-code-backend
server.port=8080

# Database Configuration (Default H2 for dev zero-config, PostgreSQL for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:gultiedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Properties
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
gultie.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
gultie.jwt.expiration-ms=86400000

# OpenAI / AI Evaluation API Key (Optional, graceful mock fallback if empty)
gultie.ai.api-key=${AI_API_KEY:}
gultie.ai.provider=${AI_PROVIDER:mock}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info

# Supabase OAuth — set these as environment variables, never hardcode
supabase.url=${SUPABASE_URL:https://your-project-ref.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
